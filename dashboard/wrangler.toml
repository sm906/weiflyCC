name = "dashboard"

compatibility_date = "2026-10-04"

main = "worker/index.js"

workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"

[[routes]]
pattern = "*.weiflycc.net/*"
zone_name = "ai.weiflycc.net"

[[d1_databases]]
binding = "DB"
database_id = "cb615e69-b922-446c-8658-da5da770c577"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weiflycc-storage"

[[previews.ai]]
binding = "AI"

