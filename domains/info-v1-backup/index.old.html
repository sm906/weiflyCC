<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威飛數研社 WeiflyCC</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans TC',sans-serif;
}

body{
background:#030712;
color:#fff;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(59,130,246,.25),transparent 35%),
radial-gradient(circle at 80% 70%,rgba(14,165,233,.15),transparent 35%),
linear-gradient(135deg,#020617,#08101d,#030712);
z-index:-2;
}

body::after{
content:'';
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:40px 40px;
z-index:-1;
}

.info{
position:fixed;
top:15px;
right:20px;
font-size:.8rem;
font-weight:900;
letter-spacing:2px;
color:#fbbf24;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:30px;
}

.container{
width:100%;
max-width:1200px;
text-align:center;
}

.logo{
font-size:clamp(3rem,9vw,7rem);
font-weight:900;
background:linear-gradient(90deg,#fff,#60a5fa,#fff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
margin-top:10px;
font-size:1.2rem;
color:#93c5fd;
}

.desc{
max-width:800px;
margin:25px auto;
line-height:1.9;
color:#cbd5e1;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.card{
padding:25px;
border-radius:20px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(8px);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:#60a5fa;
}

.card h3{
margin-bottom:10px;
}

footer{
margin-top:50px;
color:#94a3b8;
}

#cc01{
position:fixed;
width:90px;
height:90px;
left:100px;
top:150px;
cursor:pointer;
z-index:99999;
}

#cc01 img{
width:100%;
height:100%;
object-fit:contain;
}

#bubble{
display:none;
position:fixed;
padding:10px 14px;
background:#111827;
border:1px solid #3b82f6;
border-radius:20px;
white-space:nowrap;
z-index:100000;
font-size:.85rem;
}
</style>
</head>
<body>

<div class="info">INFO</div>

<section class="hero">
<div class="container">

<div class="logo">WEIFLYCC</div>

<div class="subtitle">
威飛數研社 WeiflyCC Research Studio
</div>

<div class="desc">
自主雲端 × AI整合 × 數位未來<br>
打造屬於個人與中小企業的數位營運中心
</div>

<div class="grid">

<div class="card">
<h3>🌟 weiflycc.info</h3>
品牌主入口
</div>

<div class="card">
<h3>🌐 weiflycc.com</h3>
展示館與作品集
</div>

<div class="card">
<h3>🛡️ weiflycc.org</h3>
認證中心
</div>

<div class="card">
<h3>⚙️ weiflycc.net</h3>
AI 控制中心
</div>

</div>

<footer>
Today CC, Tomorrow Cloud.<br>
哥，帶你飛 🚀
</footer>

</div>
</section>

<div id="cc01">
<img src="./static/img/cc01.png" alt="CC-01">
</div>

<div id="bubble"></div>

<script>

const cc=document.getElementById("cc01");
const bubble=document.getElementById("bubble");

const msgs=[
"今天CC了嗎？",
"迷路了嗎？",
"哥，帶你飛。",
"AI已待命。",
"歡迎來到威飛數研社。",
"Cloudflare正常連線。"
];

function say(msg){

bubble.innerText=msg;

let r=cc.getBoundingClientRect();

bubble.style.left=(r.left-150)+"px";
bubble.style.top=(r.top)+"px";
bubble.style.display="block";

setTimeout(()=>{
bubble.style.display="none";
},2500);

if(window.speechSynthesis){
speechSynthesis.cancel();
speechSynthesis.speak(
new SpeechSynthesisUtterance(msg)
);
}
}

let x=100;
let y=150;
let dx=1.2;
let dy=1.1;

function move(){

x+=dx;
y+=dy;

if(x<0||x>window.innerWidth-90)dx*=-1;
if(y<0||y>window.innerHeight-90)dy*=-1;

cc.style.left=x+"px";
cc.style.top=y+"px";

requestAnimationFrame(move);
}

move();

setInterval(()=>{
say(msgs[Math.floor(Math.random()*msgs.length)]);
},15000);

cc.onclick=()=>{
say(msgs[Math.floor(Math.random()*msgs.length)]);
};

</script>

</body>
</html>
